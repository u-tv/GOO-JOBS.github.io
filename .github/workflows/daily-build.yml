name: Daily Job Sync

on:
  workflow_dispatch:

  schedule:
    # रोज 00:00 UTC = भारत में सुबह 05:30 बजे
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-job-sync-main
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  OUTPUT_DIR: "public"

jobs:
  build:
    name: Build and Sync Public Files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate package files
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f package.json || {
            echo "::error::package.json नहीं मिला"
            exit 1
          }

          node -e "
            const pkg = require('./package.json');
            if (!pkg.scripts || !pkg.scripts.build) {
              console.error('::error::package.json में build script नहीं है');
              process.exit(1);
            }
          "

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json नहीं मिला, npm install चलाया जाएगा"
            npm install --no-audit --no-fund
          fi

      - name: Run build
        shell: bash
        env:
          CI: "true"
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Verify public folder
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::$OUTPUT_DIR/ folder generate नहीं हुआ"
            echo "अपने build command का output folder check करें"
            exit 1
          fi

          if [ -z "$(find "$OUTPUT_DIR" -mindepth 1 -print -quit)" ]; then
            echo "::error::$OUTPUT_DIR/ folder खाली है"
            exit 1
          fi

          echo "Build output verified successfully"
          find "$OUTPUT_DIR" -maxdepth 2 -type f | head -50

      - name: Commit generated files
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A public/

          if git diff --cached --quiet; then
            echo "public/ में कोई नया बदलाव नहीं है"
            exit 0
          fi

          git commit -m "chore: auto-update jobs [skip ci]"

      - name: Push changes with retry
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"

            if git push origin HEAD:main; then
              echo "Changes successfully pushed to main"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push तीन प्रयासों के बाद भी fail हुआ"
              exit 1
            fi

            echo "Remote branch update हुई है, rebase किया जा रहा है"
            git fetch origin main
            git rebase origin/main
          done
