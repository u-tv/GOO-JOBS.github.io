name: Daily Auto Sync

on:
  schedule:
    # Every day at 10:00 AM IST.
    # 10:00 IST = 04:30 UTC.
    - cron: "30 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Run Daily Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_TIMEOUT: "30"
          SYNC_ATTEMPTS: "5"
        run: |
          python scripts/sync.py

      - name: Save backup files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sync-backups || true

          if git diff --cached --quiet; then
            echo "No backup changes to commit"
          else
            git commit -m "chore: daily sync backup"
            git push
          fi

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-backups-${{ github.run_number }}
          path: sync-backups/
          if-no-files-found: ignore
          retention-days: 14
